plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
	id 'com.epages.restdocs-api-spec' version '0.19.2'
}

group = 'app.mockly'
version = '0.0.1-SNAPSHOT'
description = 'Mockly: AI based Mock Interview platform'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
    asciidoctorExt
}

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
	set('springAiVersion', "1.1.4")
}

def openapiOutputDir = layout.buildDirectory.dir('generated/openapi')

openapi3 {
	server = 'http://localhost:8080'
	title = 'Mockly API'
	description = 'AI 기반 모의 면접 플랫폼 API'
	outputDirectory = openapiOutputDir.get().asFile.path
	version = '0.0.1-SNAPSHOT'
	format = 'yaml'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
//	implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
//	implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
//	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'com.fasterxml.uuid:java-uuid-generator:4.3.0'

	implementation 'io.portone:server-sdk:0.22.0'

	implementation("com.google.api-client:google-api-client:2.7.0")
	implementation("io.jsonwebtoken:jjwt-api:0.12.6")
	runtimeOnly("io.jsonwebtoken:jjwt-impl:0.12.6")
	runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.12.6")

	// Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	compileOnly 'org.projectlombok:lombok'
    developmentOnly 'me.paulschwarz:spring-dotenv:4.0.0'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'

    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.2'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform {
		excludeTags 'latency'
	}
}

tasks.register('latencyTest', Test) {
	useJUnitPlatform {
		includeTags 'latency'
	}
	testLogging {
		showStandardStreams = true
	}
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
    configurations 'asciidoctorExt'
	dependsOn test
}

tasks.named('build') {
	dependsOn tasks.named('openapi3')
}

tasks.register('applyOpenApiSecurity') {
    dependsOn tasks.named('openapi3')

    doLast {
        def protectedOperations = fileTree(snippetsDir) {
            include '**/resource.json'
        }.files.collect { resourceFile ->
            def resource = new groovy.json.JsonSlurper().parse(resourceFile)
            if (resource.privateResource == true) {
                return "${resource.request.path}|${resource.request.method.toString().toLowerCase()}"
            }
            return null
        }.findAll { operation ->
            operation != null
        }.toSet()

        def apiSpecFile = openapiOutputDir.get().file('openapi3.yaml').asFile
        def lines = apiSpecFile.readLines('UTF-8')
        def currentPath = null
        def insertAfter = []

        lines.eachWithIndex { line, index ->
            def pathMatcher = line =~ /^  (\/[^:]+):\s*$/
            if (pathMatcher.matches()) {
                currentPath = pathMatcher.group(1)
                return
            }

            def methodMatcher = line =~ /^    (get|post|put|patch|delete|options|head|trace):\s*$/
            if (currentPath != null && methodMatcher.matches()) {
                def method = methodMatcher.group(1)
                if (!protectedOperations.contains("${currentPath}|${method}")) {
                    return
                }

                def operationEnd = index + 1
                while (operationEnd < lines.size()
                        && !(lines[operationEnd] ==~ /^    (get|post|put|patch|delete|options|head|trace):\s*$/)
                        && !(lines[operationEnd] ==~ /^  \/[^:]+:\s*$/)
                        && !(lines[operationEnd] ==~ /^[^ ]/)) {
                    operationEnd++
                }

                def alreadySecured = lines.subList(index + 1, operationEnd).any {
                    it ==~ /^      security:\s*$/
                }
                if (!alreadySecured) {
                    insertAfter << index
                }
            }
        }

        insertAfter.reverseEach { index ->
            lines.addAll(index + 1, [
                    '      security:',
                    '      - bearerAuthJWT: []'
            ])
        }
        apiSpecFile.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
    }
}

tasks.named('bootJar') {
    dependsOn tasks.named('applyOpenApiSecurity')
    dependsOn asciidoctor
    from(openapiOutputDir) {
        into 'BOOT-INF/classes/static'
    }
    from ("${asciidoctor.outputDir}") {
        into 'BOOT-INF/classes/static/docs'
    }
}

tasks.register('verifyOpenApiInBootJar') {
    dependsOn bootJar

    doLast {
        def jarFile = tasks.named('bootJar').get().archiveFile.get().asFile
        def openapiFile = zipTree(jarFile).matching {
            include 'BOOT-INF/classes/static/openapi3.yaml'
        }.singleFile
        def openapi = openapiFile.getText('UTF-8')

        if (!openapi.contains('  /api/app-status:')) {
            throw new GradleException('bootJar의 OpenAPI 문서에 /api/app-status가 없습니다')
        }

        if (!openapi.contains('    bearerAuthJWT:')) {
            throw new GradleException('bootJar의 OpenAPI 문서에 bearer 인증 스키마가 없습니다')
        }

        def protectedOperations = fileTree(snippetsDir) {
            include '**/resource.json'
        }.files.collect { resourceFile ->
            def resource = new groovy.json.JsonSlurper().parse(resourceFile)
            if (resource.privateResource == true) {
                return [
                        path: resource.request.path,
                        method: resource.request.method.toString().toLowerCase()
                ]
            }
            return null
        }.findAll { operation ->
            operation != null
        }.unique { operation ->
            "${operation.path}|${operation.method}"
        }

        protectedOperations.each { operation ->
            def pathStart = openapi.indexOf("  ${operation.path}:")
            if (pathStart < 0) {
                throw new GradleException("OpenAPI 문서에 비공개 경로 ${operation.path}가 없습니다")
            }
            def pathEnd = openapi.indexOf('\n  /api/', pathStart + 1)
            if (pathEnd < 0) {
                pathEnd = openapi.length()
            }
            def pathSection = openapi.substring(pathStart, pathEnd)
            def methodStart = pathSection.indexOf("\n    ${operation.method}:")
            if (methodStart < 0) {
                throw new GradleException("OpenAPI 문서에 비공개 operation ${operation.method.toUpperCase()} ${operation.path}가 없습니다")
            }
            def methodBodyStart = pathSection.indexOf('\n', methodStart + 1) + 1
            def methodEndMatcher = pathSection.substring(methodBodyStart) =~ /(?m)^    (get|post|put|patch|delete|options|head|trace):\s*$/
            def methodEnd = methodEndMatcher.find() ? methodBodyStart + methodEndMatcher.start() : pathSection.length()
            def methodSection = pathSection.substring(methodStart, methodEnd)
            if (!methodSection.contains('\n      security:')) {
                throw new GradleException("비공개 operation ${operation.method.toUpperCase()} ${operation.path}에 bearer 인증 정보가 없습니다")
            }
        }

        def appStatusStart = openapi.indexOf('  /api/app-status:')
        def appStatusEnd = openapi.indexOf('\n  /api/', appStatusStart + 1)
        if (appStatusEnd < 0) {
            appStatusEnd = openapi.length()
        }
        def appStatusOperation = openapi.substring(appStatusStart, appStatusEnd)
        if (appStatusOperation.contains('\n      security:')) {
            throw new GradleException('/api/app-status는 공개 API여야 합니다')
        }

    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyOpenApiInBootJar')
}
