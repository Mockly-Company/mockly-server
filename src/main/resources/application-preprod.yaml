spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never

  flyway:
    enabled: true
    # 병렬 에픽(V2~V5) 순차 머지 기간 동안 허용, 전체 머지 후 false 전환 가능
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    app.mockly: INFO
    org.springframework.security.web.FilterChainProxy: INFO
    org.springframework.security.web.util.matcher: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
